<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Battle | Director's Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f111a;
            --panel-bg: #1a1d2d;
            --border: #2a2d42;
            --text-main: #f8f9fa;
            --text-muted: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #e11d48;
            --danger-hover: #be123c;
            --success: #10b981;
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 20px;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- LOGIN VIEW --- */
        #login-view {
            max-width: 400px;
            margin: 100px auto;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
        }
        #login-view h2 { margin-top: 0; color: white; font-size: 20px; }

        .active-view { display: block !important; }
        #login-view, #dashboard-view { display: none; }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid var(--border);
        }
        .dashboard-header h1 { margin: 0; font-size: 22px; color: white; display: flex; align-items: center; gap: 10px; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
            background: rgba(148, 163, 184, 0.1); color: var(--text-muted);
        }
        .status-badge.is-live { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .is-live .status-dot { box-shadow: 0 0 8px currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .grid-container {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 25px;
            align-items: start;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .panel h2 { margin: 0 0 15px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: white; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- LEFT: PREVIEW & MAIN CONTROLS --- */
        .preview-wrapper {
            position: relative; width: 100%; aspect-ratio: 9/16;
            background: #000; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 15px;
        }
        .preview-wrapper iframe { width: 100%; height: 100%; border: none; }
        #visual-crop-box {
            position: absolute; top: 0; left: 0;
            border: 2px dashed #10b981; background: rgba(16, 185, 129, 0.1);
            pointer-events: none; display: none; box-sizing: border-box;
        }

        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        /* --- RIGHT: CONFIGURATIONS --- */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            color: white; border-radius: 6px; font-family: inherit; font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: white; font-size: 14px; }
        
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.2s;
            width: 100%; text-align: center;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }

        /* --- LOGS --- */
        .log-box {
            background: #000; color: #a3e635; padding: 12px; border-radius: 4px;
            font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto;
            border: 1px solid var(--border); margin-top: 10px;
        }

        .alert {
            position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px;
            font-weight: 500; font-size: 14px; z-index: 9999; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="alert-box" class="alert"></div>

    <!-- LOGIN -->
    <div id="login-view" class="active-view">
        <h2>Dashboard Login</h2>
        <div class="form-group">
            <input type="password" id="login-key" placeholder="Enter LOGIN_KEY">
        </div>
        <button class="btn" onclick="login()">Access Dashboard</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-view">
        <div class="dashboard-header">
            <h1>🌐 Flag Battle Director</h1>
            <div class="status-badge" id="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>

        <div class="grid-container">
            <!-- LEFT COLUMN: PREVIEW & ACTIONS -->
            <div class="left-col">
                <div class="panel" style="margin-bottom: 20px;">
                    <h2>Stream Preview</h2>
                    <div class="preview-wrapper">
                        <iframe id="preview-frame" src="/game.html?stream=true"></iframe>
                        <div id="visual-crop-box"></div>
                    </div>
                    
                    <button class="btn" id="btn-start" onclick="startStream()">▶ Start 24/7 Stream (Boot Headless)</button>
                    <button class="btn btn-danger" id="btn-stop" style="display:none;" onclick="stopStream()">⏹ Stop Stream</button>
                </div>

                <div class="panel">
                    <h2>Live Game Controls</h2>
                    <p style="font-size:12px; color:var(--text-muted); margin-top:0;">Trigger actions live inside the stream.</p>
                    <div class="action-row">
                        <button class="btn btn-outline" onclick="controlGame('start')">▶ Play Round</button>
                        <button class="btn btn-outline" onclick="controlGame('pause')">⏸ Pause/Resume</button>
                    </div>
                    <button class="btn btn-outline" onclick="controlGame('reset')" style="width:100%; border-color:var(--danger); color:var(--danger);">↺ Reset Match</button>
                </div>
            </div>

            <!-- RIGHT COLUMN: SETTINGS -->
            <div class="right-col">
                
                <div class="panel" style="margin-bottom: 20px;">
                    <h2>Match Mechanics & Logic</h2>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label>Total Countries to Spawn</label>
                            <input type="number" id="live-total-countries" min="10" max="245" value="195">
                        </div>
                        <div class="form-group">
                            <label>Rounds (Best of X)</label>
                            <input type="number" id="live-total-rounds" min="1" max="100" value="1">
                        </div>
                        <div class="form-group">
                            <label>Match Duration (Minutes)</label>
                            <input type="number" id="live-time-limit" min="1" max="120" value="5">
                        </div>
                        <div class="form-group">
                            <label>Team Up Mode</label>
                            <select id="live-teams">
                                <option value="none">Free for All (Solo)</option>
                                <option value="2">2 Teams (Red vs Blue)</option>
                                <option value="4">4 Teams</option>
                                <option value="continents">By Continent</option>
                            </select>
                        </div>
                    </div>
                    
                    <h2 style="margin-top: 15px;">Physics & Experience</h2>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label>Game Speed (1-5)</label>
                            <input type="number" id="live-speed" min="1" max="5" value="1">
                        </div>
                        <div class="form-group">
                            <label>Gravity Magnitude</label>
                            <input type="number" id="live-gravity" step="0.1" value="0.0">
                        </div>
                    </div>
                    <label class="checkbox-label" style="margin-bottom: 20px;">
                        <input type="checkbox" id="live-bias" checked> Enable Audience Bias (Dramatic Near Misses)
                    </label>

                    <h2>Branding</h2>
                    <div class="form-group">
                        <label>Watermark / Channel Name</label>
                        <input type="text" id="live-watermark" placeholder="@YourChannel" value="@FlagsBattleSimulator">
                    </div>
                </div>

                <div class="panel" style="margin-bottom: 20px;">
                    <h2>Stream & Broadcast Setup</h2>
                    <div class="form-group">
                        <label>Stream URL</label>
                        <input type="text" id="set-stream-url" placeholder="rtmp://a.rtmp.youtube.com/live2">
                    </div>
                    <div class="form-group">
                        <label>Secret Key</label>
                        <input type="password" id="set-stream-key" placeholder="xxxx-xxxx-xxxx-xxxx">
                    </div>
                    <div class="form-group">
                        <label>Video Bitrate (Kbps)</label>
                        <input type="number" id="set-bitrate" value="6800" min="1000" max="20000" step="100">
                    </div>
                    
                    <label class="checkbox-label" style="margin: 15px 0;">
                        <input type="checkbox" id="set-crop-enable" onchange="updateVisualCrop()"> Enable Area Selection (Crop)
                    </label>
                    <div class="settings-grid" style="grid-template-columns: repeat(4, 1fr);">
                        <div class="form-group"><label>X Offset</label><input type="number" id="set-crop-x" value="0" min="0" oninput="updateVisualCrop()"></div>
                        <div class="form-group"><label>Y Offset</label><input type="number" id="set-crop-y" value="0" min="0" oninput="updateVisualCrop()"></div>
                        <div class="form-group"><label>Width</label><input type="number" id="set-crop-w" value="540" min="10" oninput="updateVisualCrop()"></div>
                        <div class="form-group"><label>Height</label><input type="number" id="set-crop-h" value="960" min="10" oninput="updateVisualCrop()"></div>
                    </div>
                </div>

                <button class="btn" onclick="saveAndApplySettings()" style="margin-bottom: 20px;">💾 Save & Apply All Settings</button>

                <div class="panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px;">
                        <h2 style="margin:0; border:none; padding:0;">System Logs</h2>
                        <button class="btn btn-outline" style="width:auto; padding: 4px 10px; font-size:11px;" onclick="clearLogs()">Clear</button>
                    </div>
                    <div class="log-box" id="log-content">Loading...</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const API_HEADERS = () => ({
            'Content-Type': 'application/json',
            'x-login-key': localStorage.getItem('fb_login_key') || ''
        });
        
        let authKey = localStorage.getItem('fb_login_key');
        const alertBox = document.getElementById('alert-box');

        function showAlert(msg, isError = false) {
            alertBox.textContent = msg;
            alertBox.style.background = isError ? 'rgba(225, 29, 72, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            alertBox.style.color = '#fff';
            alertBox.style.border = 'none';
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        function showView(viewId) {
            document.getElementById('login-view').classList.remove('active-view');
            document.getElementById('dashboard-view').classList.remove('active-view');
            document.getElementById(viewId).classList.add('active-view');
        }

        async function checkAuth() {
            if (!authKey) return showView('login-view');
            try {
                const res = await fetch('/api/status', { headers: API_HEADERS() });
                if (res.status === 401) {
                    localStorage.removeItem('fb_login_key');
                    return showView('login-view');
                }
                const data = await res.json();
                showView('dashboard-view');
                applyStatus(data);
                populateSettings(data.settings);
                fetchLogs();
            } catch (e) { console.error(e); }
        }

        async function login() {
            const key = document.getElementById('login-key').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            if (res.ok) {
                authKey = key;
                localStorage.setItem('fb_login_key', key);
                checkAuth();
            } else showAlert('Invalid Login Key', true);
        }

        function applyStatus(data) {
            const isLive = data.isStreaming;
            document.getElementById('btn-start').style.display = isLive ? 'none' : 'block';
            document.getElementById('btn-stop').style.display = isLive ? 'block' : 'none';
            
            const badge = document.getElementById('status-badge');
            const txt = document.getElementById('status-text');
            if (isLive) {
                badge.classList.add('is-live');
                txt.textContent = 'STREAMING LIVE';
            } else {
                badge.classList.remove('is-live');
                txt.textContent = 'OFFLINE';
            }
        }

        async function startStream() {
            document.getElementById('btn-start').disabled = true;
            try {
                const res = await fetch('/api/start-stream', { method: 'POST', headers: API_HEADERS() });
                const data = await res.json();
                if (data.success) {
                    showAlert('Stream booting! FFmpeg starting...');
                    checkAuth();
                } else showAlert(data.error || 'Error', true);
            } catch (e) { showAlert('Error', true); }
            document.getElementById('btn-start').disabled = false;
        }

        async function stopStream() {
            document.getElementById('btn-stop').disabled = true;
            try {
                const res = await fetch('/api/stop-stream', { method: 'POST', headers: API_HEADERS() });
                if (res.ok) { showAlert('Stream stopped'); checkAuth(); }
            } catch (e) {}
            document.getElementById('btn-stop').disabled = false;
        }

        function populateSettings(s) {
            if(!s) return;
            document.getElementById('set-stream-url').value = s.streamUrl || '';
            document.getElementById('set-stream-key').value = s.streamKey || '';
            if (s.bitrate !== undefined) document.getElementById('set-bitrate').value = s.bitrate;
            if (s.crop) {
                document.getElementById('set-crop-enable').checked = s.crop.enabled;
                document.getElementById('set-crop-x').value = s.crop.x;
                document.getElementById('set-crop-y').value = s.crop.y;
                document.getElementById('set-crop-w').value = s.crop.w;
                document.getElementById('set-crop-h').value = s.crop.h;
                updateVisualCrop();
            }
            if (s.gameSettings) {
                if (s.gameSettings.watermark !== undefined) document.getElementById('live-watermark').value = s.gameSettings.watermark;
                if (s.gameSettings.speed !== undefined) document.getElementById('live-speed').value = s.gameSettings.speed;
                if (s.gameSettings.gravity !== undefined) document.getElementById('live-gravity').value = s.gameSettings.gravity;
                if (s.gameSettings.bias !== undefined) document.getElementById('live-bias').checked = s.gameSettings.bias;
                if (s.gameSettings.totalCountries !== undefined) document.getElementById('live-total-countries').value = s.gameSettings.totalCountries;
                if (s.gameSettings.totalRounds !== undefined) document.getElementById('live-total-rounds').value = s.gameSettings.totalRounds;
                if (s.gameSettings.timeLimit !== undefined) document.getElementById('live-time-limit').value = s.gameSettings.timeLimit;
                if (s.gameSettings.teams !== undefined) document.getElementById('live-teams').value = s.gameSettings.teams;
            }
        }

        async function saveAndApplySettings() {
            const gamePayload = {
                watermark: document.getElementById('live-watermark').value,
                speed: parseInt(document.getElementById('live-speed').value),
                gravity: parseFloat(document.getElementById('live-gravity').value),
                bias: document.getElementById('live-bias').checked,
                totalCountries: parseInt(document.getElementById('live-total-countries').value),
                totalRounds: parseInt(document.getElementById('live-total-rounds').value),
                timeLimit: parseInt(document.getElementById('live-time-limit').value),
                teams: document.getElementById('live-teams').value
            };
            
            const rtmpPayload = {
                streamUrl: document.getElementById('set-stream-url').value,
                streamKey: document.getElementById('set-stream-key').value,
                bitrate: parseInt(document.getElementById('set-bitrate').value) || 6800,
                crop: {
                    enabled: document.getElementById('set-crop-enable').checked,
                    x: parseInt(document.getElementById('set-crop-x').value),
                    y: parseInt(document.getElementById('set-crop-y').value),
                    w: parseInt(document.getElementById('set-crop-w').value),
                    h: parseInt(document.getElementById('set-crop-h').value)
                }
            };

            // 1. Save persistently
            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: API_HEADERS(),
                    body: JSON.stringify({ ...rtmpPayload, gameSettings: gamePayload })
                });
            } catch(e) {}
            
            // 2. Apply game settings live if streaming
            const isLive = document.getElementById('status-badge').classList.contains('is-live');
            
            if (isLive) {
                try {
                    const res = await fetch('/api/control', {
                        method: 'POST',
                        headers: API_HEADERS(),
                        body: JSON.stringify({ action: 'settings', payload: gamePayload })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showAlert('Settings saved & injected into live stream!');
                    } else {
                        showAlert(data.error || 'Failed to apply live', true);
                    }
                } catch(e) { showAlert('Network error', true); }
            } else {
                // Apply locally to preview frame
                const frame = document.getElementById('preview-frame');
                if (frame && frame.contentWindow) {
                    frame.contentWindow.__liveSettings = gamePayload;
                    
                    if (frame.contentWindow.gameInstance) {
                        const gi = frame.contentWindow.gameInstance;
                        if (gamePayload.watermark !== undefined) gi.ui.setChannel(gamePayload.watermark);
                        if (gamePayload.speed !== undefined) gi.physics.setStepsPerFrame(gamePayload.speed);
                        if (gamePayload.gravity !== undefined) gi.physics.setGravity(gamePayload.gravity);
                        if (gamePayload.bias !== undefined) gi.audienceBias = gamePayload.bias;
                    }
                }
                showAlert('Settings saved and applied to Local Preview!');
            }
        }

        async function controlGame(action) {
            const isLive = document.getElementById('status-badge').classList.contains('is-live');
            
            if (isLive) {
                try {
                    const res = await fetch('/api/control', {
                        method: 'POST',
                        headers: API_HEADERS(),
                        body: JSON.stringify({ action })
                    });
                    const data = await res.json();
                    if (!res.ok) showAlert(data.error || 'Control error', true);
                } catch(e) { showAlert('Network error', true); }
            } else {
                // Control local preview frame
                const frame = document.getElementById('preview-frame');
                if (frame && frame.contentWindow) {
                    if (action === 'start') {
                        frame.contentWindow.document.getElementById('btn-start')?.click();
                    } else if (action === 'pause') {
                        frame.contentWindow.document.getElementById('btn-pause')?.click();
                    } else if (action === 'reset') {
                        frame.contentWindow.document.getElementById('btn-reset')?.click();
                    }
                }
            }
        }

        // Crop Preview Update
        function updateVisualCrop() {
            const enabled = document.getElementById('set-crop-enable').checked;
            const box = document.getElementById('visual-crop-box');
            if (!enabled) { box.style.display = 'none'; return; }
            
            box.style.display = 'block';
            const x = parseInt(document.getElementById('set-crop-x').value) || 0;
            const y = parseInt(document.getElementById('set-crop-y').value) || 0;
            const w = parseInt(document.getElementById('set-crop-w').value) || 540;
            const h = parseInt(document.getElementById('set-crop-h').value) || 960;
            
            // Since preview iframe might scale, we assume it fills 100% width of a 540x960 aspect ratio container.
            // But actually CSS handles width:100% and aspect-ratio:9/16, so the wrapper is proportionally scaled.
            // The box coordinates must be % based to overlay correctly regardless of actual wrapper pixel size.
            box.style.left = (x / 540 * 100) + '%';
            box.style.top = (y / 960 * 100) + '%';
            box.style.width = (w / 540 * 100) + '%';
            box.style.height = (h / 960 * 100) + '%';
        }

        // Logs
        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs', { headers: API_HEADERS() });
                const logs = await res.text();
                const logBox = document.getElementById('log-content');
                logBox.textContent = logs || 'No logs yet.';
                logBox.scrollTop = logBox.scrollHeight;
            } catch (e) {}
        }
        async function clearLogs() {
            try {
                await fetch('/api/logs', { method: 'DELETE', headers: API_HEADERS() });
                fetchLogs();
            } catch (e) {}
        }

        setInterval(() => {
            if (document.getElementById('dashboard-view').classList.contains('active-view')) {
                fetchLogs();
            }
        }, 5000);

        checkAuth();
    </script>
</body>
</html>
